- name: Setting up Payment Env
  hosts: payment
  become: yes
  tasks:
  - name: Installing packages
    package: 
      name: "{{ item }}"
      state: present
    loop:
    - python3
    - gcc
    - python3-devel
  - name: Create the app user
    user:
      name: roboshop
      shell: /sbin/nologin
      home: /app
      system: true
      comment: "Roboshop system user"
  - name: Deleting /app if already exists
    file:
      path: /app
      state: absent
  - name: Recreating the /app
    file:
      path: /app
      state: directory
  - name: delete payment.zip in tmp directory
    file:
      path: /tmp/payment.zip
      state: absent
  - name: Downloading the packages and Dependencies
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
      dest: /tmp/payment.zip
  - name: extracting the packages
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes  
  - name: Installing the Dependencies
    pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app
  - name: Copying the payment service
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service
  - name: Reloading the daemon
    systemd_service:
      name: payment
      daemon_reload: true
  - name: Starting and Enabling the services
    service:
      name: payment
      state: restarted
      enabled: yes
