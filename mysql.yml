- name: Setting up MySQL Env
  hosts: mysql
  become: yes
  tasks:
  - name: Installing mysql-server
    package: 
      name: mysql-server
      state: present
  - name: Enabling and restart services
    service:
      name: mysqld
      state: started
      enabled: yes
  - name: setting up the root user
    command: mysql_secure_installation --set-root-pass RoboShop@1
