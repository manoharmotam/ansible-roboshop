- name: Setting up User Env
  hosts: user
  become: yes
  tasks:
  - name: Enabling the module
    command: dnf module enable nodejs:20 -y
  - name: Installing nodejs 20
    package: 
      name: nodejs
      state: present
  - name: Create the app user
    user:
      name: roboshop
      shell: /sbin/nologin
      home: /app
      system: true
      comment: "Roboshop system user"
  - name: Deleting /app if already exists
    file:
      path: /app
      state: absent
  - name: Recreating the /app
    file:
      path: /app
      state: directory
  - name: delete user.zip in tmp directory
    file:
      path: /tmp/user.zip
      state: absent
  - name: Downloading the packages and Dependencies
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip 
      dest: /tmp/user.zip
  - name: extracting the packages
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes
  - name: Installing Dependencies
    community.general.npm:
      path: /app
  - name: Copying the user service
    template:
      src: user.service.j2
      dest: /etc/systemd/system/user.service
  - name: Reloading the daemon
    systemd_service:
      name: user
      daemon_reload: true
  - name: Starting and Enabling the services
    service:
      name: user
      state: restarted
      enabled: yes

